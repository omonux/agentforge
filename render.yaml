services:
  - type: web
    name: agentforge
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: agentforge-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/agentforge.db
      - key: COOKIE_SECURE
        value: "true"
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4.1-mini
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_SALT
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: BILLING_BASE_URL
        sync: false
      - key: BILLING_LIVE_ENABLED
        value: "false"
      - key: AGENTFORGE_PRO_MONTHLY_NGN
        sync: false
      - key: AGENTFORGE_BUSINESS_MONTHLY_NGN
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PRO_MONTHLY_PLAN_CODE
        sync: false
      - key: PAYSTACK_BUSINESS_MONTHLY_PLAN_CODE
        sync: false
      - key: OPAY_API_BASE_URL
        value: https://sandboxapi.opaycheckout.com
      - key: OPAY_COUNTRY
        value: NG
      - key: OPAY_CURRENCY
        value: NGN
      - key: OPAY_PUBLIC_KEY
        sync: false
      - key: OPAY_SECRET_KEY
        sync: false
      - key: OPAY_MERCHANT_ID
        sync: false
