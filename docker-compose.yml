services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_PATH: /data/agentforge.db
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - agentforge_data:/data
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  agentforge_data:
